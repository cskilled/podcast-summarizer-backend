version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: podcast_db
    environment:
      POSTGRES_USER: podcast_user
      POSTGRES_PASSWORD: podcast_pass
      POSTGRES_DB: podcast_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcast_user -d podcast_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - podcast_network

  app:
    build: .
    container_name: podcast_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://podcast_user:podcast_pass@postgres:5432/podcast_db
      # Pass AWS credentials from .env file
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./.env:/app/.env
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000
    networks:
      - podcast_network

networks:
  podcast_network:
    driver: bridge

volumes:
  postgres_data: